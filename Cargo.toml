[package]
name = "Renjulibviewer_v2"
version = "0.1.0"
edition = "2024"
description = "A high-performance Renju library and database viewer with modern GUI."
license = "GPL-3.0"
repository = "https://github.com/nachirenju/Renjulibviewer_v2.git"
readme = "README.md"
keywords = ["renju", "gomoku", "viewer", "egui"]
categories = ["games", "gui"]

[lib]
name = "renjulibviewer_native"
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "Renjulibviewer_v2"
path = "src/main.rs"

[dependencies]
# --- 全プラットフォーム共通の依存関係 ---
eframe = { version = "0.30", default-features = false, features = ["android-native-activity", "default_fonts", "glow", "persistence"] }
encoding_rs = "0.8"
lz4_flex = "0.11"
byteorder = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.24"
rustc-hash = "2.1"
# Quintet's DF-PNS VCT engine is kept separate from this application's VCF
# and Threat viewer APIs.  See THIRD_PARTY_NOTICES for its MIT license.
quintet = { path = "third_party/quintet" }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
rfd = "0.15"
rand = "0.8"
web-time = "1.1"
memmap2 = "0.9"
pollster = "0.3"
rayon = "1.10"

[target.'cfg(target_os = "ios")'.dependencies]
rand = "0.8"
web-time = "1.1"
pollster = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
rand = "0.8"
web-time = "1.1"
pollster = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd = "0.15"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
web-time = "1.1"
log = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Storage", "Worker"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# --- Windows専用 ---
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

# --- ビルドスクリプト用（Windowsのアイコン設定用） ---
[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3        
lto = true           
codegen-units = 1    
panic = "abort"      
